<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Joe Burrow 2021 (semanas 1–8): ¿qué pasa según cuánto tarda en lanzar?</text>
  <text x="390" y="52" text-anchor="middle" font-size="13" fill="#555">Segundos entre que recibe el balón (snap) y lo lanza o lo derriban. Entre paréntesis, número de jugadas.</text>

  <!-- Panel izquierdo: yardas por jugada (escala 0–12) -->
  <text x="205" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Yardas ganadas por jugada</text>
  <line x1="40" y1="300" x2="370" y2="300" stroke="#999"/>
  <rect x="56" y="158.5" width="50" height="141.5" fill="#111"/>
  <rect x="138.5" y="128.8" width="50" height="171.2" fill="#FB4F14"/>
  <rect x="221" y="162.3" width="50" height="137.7" fill="#111"/>
  <rect x="303.5" y="239.2" width="50" height="60.8" fill="#111"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#111">
    <text x="81" y="152">8.5</text>
    <text x="163.5" y="122">10.3</text>
    <text x="246" y="156">8.3</text>
    <text x="328.5" y="233">3.7</text>
  </g>

  <!-- Panel derecho: % de sacks (escala 0–40 %) -->
  <text x="575" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#111">% de jugadas que terminan en sack</text>
  <line x1="410" y1="300" x2="740" y2="300" stroke="#999"/>
  <rect x="426" y="299" width="50" height="1" fill="#B91C1C"/>
  <rect x="508.5" y="293" width="50" height="7" fill="#B91C1C"/>
  <rect x="591" y="270.5" width="50" height="29.5" fill="#B91C1C"/>
  <rect x="673.5" y="123" width="50" height="177" fill="#B91C1C"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#111">
    <text x="451" y="292">0 %</text>
    <text x="533.5" y="286">1.4 %</text>
    <text x="616" y="264">5.9 %</text>
    <text x="698.5" y="116">35.4 %</text>
  </g>

  <!-- Etiquetas de los tramos -->
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="81" y="318">&lt; 2.5 s</text><text x="81" y="333">(94)</text>
    <text x="163.5" y="318">2.5–3.0 s</text><text x="163.5" y="333">(70)</text>
    <text x="246" y="318">3.0–3.5 s</text><text x="246" y="333">(34)</text>
    <text x="328.5" y="318">&gt; 3.5 s</text><text x="328.5" y="333">(48)</text>
    <text x="451" y="318">&lt; 2.5 s</text><text x="451" y="333">(94)</text>
    <text x="533.5" y="318">2.5–3.0 s</text><text x="533.5" y="333">(70)</text>
    <text x="616" y="318">3.0–3.5 s</text><text x="616" y="333">(34)</text>
    <text x="698.5" y="318">&gt; 3.5 s</text><text x="698.5" y="333">(48)</text>
  </g>
  <text x="390" y="365" text-anchor="middle" font-size="13" fill="#555">Punto dulce: soltar el balón antes de 3 segundos. Después de 3.5 s, 1 de cada 3 jugadas es un sack.</text>
</svg>
